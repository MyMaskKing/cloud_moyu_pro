<svg width="1024" height="1024" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="云摸鱼">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa3ff"/>
      <stop offset=".55" stop-color="#2f6ff0"/>
      <stop offset="1" stop-color="#163fbf"/>
    </linearGradient>
    <radialGradient id="gloss" cx="50%" cy="20%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4eefc"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b86ff"/>
      <stop offset="1" stop-color="#0c3a9e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="3" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gloss)"/>

  <!-- 普通云朵：顶部三道圆润凸起，底部接近平直，左右镜像 -->
  <g filter="url(#soft)">
    <path fill="url(#cloud)" stroke="#cfe0f6" stroke-width="1"
      d="M64 32
         C56 32 49 35 45 41
         C41 40 33 41 29 48
         C22 50 16 58 16 68
         C16 82 26 90 42 89
         C50 91 57 92 64 92
         C71 92 78 91 86 89
         C102 90 112 82 112 68
         C112 58 106 50 99 48
         C95 41 87 40 83 41
         C79 35 72 32 64 32 Z"/>
  </g>

  <!-- A 腾跃鱼：弧线身、头朝左上、尾展右下 -->
  <g>
    <path fill="#0a3289" d="M82 61 L97 53 L90 66 L97 79 L81 72 Z"/>
    <path fill="url(#fish)"
      d="M35 56 C40 47 57 44 73 55 C82 61 85 65 83 69 C80 74 66 80 50 75 C41 72 37 66 35 60 Z"/>
    <path d="M42 55 C52 50 65 52 74 58" fill="none" stroke="#a9ccff"
          stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
    <circle cx="42" cy="55" r="3.3" fill="#ffffff"/>
    <circle cx="43" cy="54.3" r="1.4" fill="#0c2a6b"/>
  </g>
</svg>
