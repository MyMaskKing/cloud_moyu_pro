# 主窗口用:允许调用 app 自身的所有自定义命令
# Tauri v2 一旦项目里存在任何 permissions/*.toml,ACL manifest 就会生效,
# 此后连 local origin 的自定义命令也要显式允许(参见 on_message 源码 has_app_acl_manifest 分支)

[[permission]]
identifier = "allow-app-commands"
description = "允许主窗口/子窗口调用摸鱼应用自身的所有自定义命令"
commands.allow = [
    "open_web_tab",
    "resize_web_tab",
    "close_web_tab",
    "close_all_web_tabs",
    "set_web_tab_visible",
    "set_web_tab_visible_only",
    "web_tab_exists",
    "web_tab_bounds",
    "get_cursor_position",
    "focus_web_tab",
    "set_web_tab_opacity",
    "set_all_web_tabs_opacity",
    "set_web_tab_resizable",
    "set_web_tab_chrome",
    "set_web_tab_owner",
    "web_tab_go_back",
    "web_tab_go_forward",
    "web_tab_reload",
    "enter_pip",
    "exit_pip",
    "signal_video_play",
    "signal_video_fullscreen",
    "request_video_fullscreen",
    "show_context_menu",
    "hide_context_menu",
    "is_hidden",
    "trigger_boss_key",
    "update_boss_shortcut",
    "update_transparency_shortcut",
    "set_main_window_pinned",
    "set_web_tab_pinned",
    "notify_web_tab_mode",
    "popout_start_drag",
    "popout_toggle_maximize",
    "popout_window_action",
    "set_work_monitor_config",
    "set_all_tabs_hidden",
    "set_reading_disguise",
    "enter_pet_mode",
    "exit_pet_mode",
    "set_boss_action_pet",
    "set_pet_config",
    "set_pet_size",
    "set_pet_always_on_top",
    "set_pet_typing",
    "is_pet_mode",
    "pet_say",
    "set_user_scripts",
]
